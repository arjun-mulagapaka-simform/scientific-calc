<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
    <title>Calculator</title>
</head>

<body class="d-flex flex-column align-items-center gap-2 justify-content-center primary-text-color min-vh-100">
    <h1 class="top-heading">Scientific Calculator</h1>
    <main class="container-fluid d-flex flex-column gap-2 main-w bg-bg-color rounded-3">
        <div class="num-input w-100">
            <input type="text" class="form-control form-control-lg p-1 w-100 bg-bg-color border-0 text-end" placeholder="0" id="inp-num" readonly>
        </div>
        <div class="d-flex justify-content-start gap-2 deg-controls">
            <button class="btn p-2">DEG</button>
            <button class="btn p-2">F-E</button>
        </div>
        <div class="w-100 mx-auto">
            <div class="row">
                <button class="btn col p-2 muted-text-color" data-op="memclear" disabled>MC</button>
                <button class="btn col p-2 muted-text-color" data-op="memreset" disabled>MR</button>
                <button class="btn col p-2" data-op="memaddition">M+</button>
                <button class="btn col p-2" data-op="memsubtraction">M-</button>
                <button class="btn col p-2" data-op="memshow">MS</button>
            </div>
        </div>
        <div class="d-flex justify-content-start gap-1">
            <button class="btn p-2">Trigonometry</button>
            <button class="btn p-2">Function</button>
        </div>
        <div class="w-100 mx-auto px-2 py-1">
            <div class="row gap-1 my-1">
                <button class="btn p-2 col primary-bg-color">2<sup>nd</sup></button>
                <button class="btn p-2 col primary-bg-color" data-op="pi">π</button>
                <button class="btn p-2 col primary-bg-color" data-op="euler">e</button>
                <button class="btn p-2 col primary-bg-color input-manipulator-btn" data-op="clear">C</button>
                <button class="btn p-2 col primary-bg-color input-manipulator-btn" data-op="removelastchar">x</button>
            </div>
            <div class="row gap-1 my-1">
                <button class="btn p-2 col primary-bg-color unary-btn" data-op="square">x<sup>2</sup></button>
                <button class="btn p-2 col primary-bg-color unary-btn" data-op="inverse"><sup>1</sup>/x</button>
                <button class="btn p-2 col primary-bg-color unary-btn" data-op="absolute">|x|</button>
                <button class="btn p-2 col primary-bg-color binary-btn" data-op="power">exp</button>
                <button class="btn p-2 col primary-bg-color binary-btn" data-op="modulo">mod</button>
            </div>
            <div class="row gap-1 my-1">
                <button class="btn p-2 col primary-bg-color unary-btn" data-op="squareroot"><sup>2</sup>√x</button>
                <button class="btn p-2 col primary-bg-color" data-op="append">(</button>
                <button class="btn p-2 col primary-bg-color" data-op="append">)</button>
                <button class="btn p-2 col primary-bg-color unary-btn" data-op="factorial">n!</button>
                <button class="btn p-2 col primary-bg-color binary-btn" data-op="division">/</button>
            </div>
            <div class="row gap-1 my-1">
                <button class="btn p-2 col primary-bg-color binary-btn" data-op="power">x<sup>y</sup></button>
                <button class="btn p-2 col bg-white fw-bold digit-btn" data-op="7">7</button>
                <button class="btn p-2 col bg-white fw-bold digit-btn" data-op="8">8</button>
                <button class="btn p-2 col bg-white fw-bold digit-btn" data-op="9">9</button>
                <button class="btn p-2 col primary-bg-color binary-btn" data-op="multiplication">X</button>
            </div>
            <div class="row gap-1 my-1">
                <button class="btn p-2 col primary-bg-color unary-btn" data-op="10power">10<sup>x</sup></button>
                <button class="btn p-2 col bg-white fw-bold digit-btn" data-op="4">4</button>
                <button class="btn p-2 col bg-white fw-bold digit-btn" data-op="5">5</button>
                <button class="btn p-2 col bg-white fw-bold digit-btn" data-op="6">6</button>
                <button class="btn p-2 col primary-bg-color binary-btn" data-op="subtraction">--</button>
            </div>
            <div class="row gap-1 my-1">
                <button class="btn p-2 col primary-bg-color unary-btn" data-op="log">log</button>
                <button class="btn p-2 col bg-white fw-bold digit-btn" data-op="1">1</button>
                <button class="btn p-2 col bg-white fw-bold digit-btn" data-op="2">2</button>
                <button class="btn p-2 col bg-white fw-bold digit-btn" data-op="3">3</button>
                <button class="btn p-2 col primary-bg-color binary-btn" data-op="addition">+</button>
            </div>
            <div class="row gap-1 my-1">
                <button class="btn p-2 col primary-bg-color unary-btn" data-op="naturallog">ln</button>
                <button class="btn p-2 col primary-bg-color bg-white fw-bold input-manipulator-btn" data-op="togglesign"><sup>+</sup>/-</button>
                <button class="btn p-2 col primary-bg-color bg-white fw-bold digit-btn" data-op="0">0</button>
                <button class="btn p-2 col primary-bg-color bg-white fw-bold input-manipulator-btn" data-op="decimal">.</button>
                <button class="btn p-2 btn-primary col" data-op="equals">=</button>
            </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
