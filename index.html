<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>Calculator</title>
</head>

<body class="d-flex flex-column align-items-center gap-2 justify-content-center primary-text-color min-vh-100">
    <h1 class="top-heading">Scientific Calculator</h1>
    <main class="container-fluid d-flex flex-column gap-2 main-w bg-bg-color rounded-3">
        <div class="num-input w-100">
            <input type="number" class="form-control form-control-lg p-1 w-100 bg-bg-color border-0 text-end" placeholder="0" id="inp-num">
        </div>
        <div class="d-flex justify-content-start gap-2 deg-controls">
            <button class="btn p-2">DEG</button>
            <button class="btn p-2">F-E</button>
        </div>
        <div class="w-100 mx-auto">
            <div class="row">
                <button class="btn col p-2 muted-text-color" disabled>MC</button>
                <button class="btn col p-2 muted-text-color" disabled>MR</button>
                <button class="btn col p-2">M+</button>
                <button class="btn col p-2">M-</button>
                <button class="btn col p-2">MS</button>
            </div>
        </div>
        <div class="d-flex justify-content-start gap-1">
            <button class="btn p-2">Trigonometry</button>
            <button class="btn p-2">Function</button>
        </div>
        <div class="w-100 mx-auto px-2 py-1">
            <div class="row gap-1 my-1">
                <button class="btn p-2 col primary-bg-color">2<sup>nd</sup></button>
                <button class="btn p-2 col primary-bg-color">π</button>
                <button class="btn p-2 col primary-bg-color">e</button>
                <button class="btn p-2 col primary-bg-color">C</button>
                <button class="btn p-2 col primary-bg-color">x</button>
            </div>
            <div class="row gap-1 my-1">
                <button class="btn p-2 col primary-bg-color">x<sup>2</sup></button>
                <button class="btn p-2 col primary-bg-color"><sup>1</sup>/x</button>
                <button class="btn p-2 col primary-bg-color">|x|</button>
                <button class="btn p-2 col primary-bg-color">exp</button>
                <button class="btn p-2 col primary-bg-color">mod</button>
            </div>
            <div class="row gap-1 my-1">
                <button class="btn p-2 col primary-bg-color"><sup>2</sup>√x</button>
                <button class="btn p-2 col primary-bg-color">(</button>
                <button class="btn p-2 col primary-bg-color">)</button>
                <button class="btn p-2 col primary-bg-color">n!</button>
                <button class="btn p-2 col primary-bg-color">/</button>
            </div>
            <div class="row gap-1 my-1">
                <button class="btn p-2 col primary-bg-color">x<sup>y</sup></button>
                <button class="btn p-2 col bg-white fw-bold">7</button>
                <button class="btn p-2 col bg-white fw-bold">8</button>
                <button class="btn p-2 col bg-white fw-bold">9</button>
                <button class="btn p-2 col primary-bg-color">X</button>
            </div>
            <div class="row gap-1 my-1">
                <button class="btn p-2 col primary-bg-color">10<sup>x</sup></button>
                <button class="btn p-2 col bg-white fw-bold">4</button>
                <button class="btn p-2 col bg-white fw-bold">5</button>
                <button class="btn p-2 col bg-white fw-bold">6</button>
                <button class="btn p-2 col primary-bg-color">--</button>
            </div>
            <div class="row gap-1 my-1">
                <button class="btn p-2 col primary-bg-color">log</button>
                <button class="btn p-2 col bg-white fw-bold">1</button>
                <button class="btn p-2 col bg-white fw-bold">2</button>
                <button class="btn p-2 col bg-white fw-bold">3</button>
                <button class="btn p-2 col primary-bg-color">+</button>
            </div>
            <div class="row gap-1 my-1">
                <button class="btn p-2 col primary-bg-color">ln</button>
                <button class="btn p-2 col primary-bg-color bg-white fw-bold"><sup>+</sup>/-</button>
                <button class="btn p-2 col primary-bg-color bg-white fw-bold">0</button>
                <button class="btn p-2 col primary-bg-color bg-white fw-bold">.</button>
                <button class="btn p-2 btn-primary col">=</button>
            </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
